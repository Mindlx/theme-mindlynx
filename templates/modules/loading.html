<div class="fixed inset-0 z-9999 flex items-center justify-center bg-gray-100 transition-opacity duration-500 dark:bg-gray-900" id="global-loading">
  <div class="flex flex-col items-center px-6">
    <div class="relative inline-flex aspect-square min-h-28 min-w-28 items-center justify-center p-8 sm:min-h-36 sm:min-w-36 sm:p-10">
      <div class="absolute inset-0 rounded-full border-[3px] border-gray-200 dark:border-gray-700"></div>
      <div
        class="absolute inset-0 animate-spin rounded-full border-[3px] border-transparent border-t-gray-700 border-r-gray-500 dark:border-t-gray-300 dark:border-r-gray-400"
        style="animation-duration: 1.5s"
      ></div>
      <div
        class="absolute inset-4 animate-spin rounded-full border-[3px] border-transparent border-b-gray-600 border-l-gray-500 dark:border-b-gray-400 dark:border-l-gray-500"
        style="animation-duration: 2s; animation-direction: reverse"
      ></div>
      <div class="flex flex-col items-center justify-center space-y-3">
        <div class="flex items-end space-x-1">
          <div class="h-4 w-1 animate-pulse rounded-full bg-gray-800 [animation-delay:0ms] [animation-duration:1s] dark:bg-gray-200"></div>
          <div class="h-7 w-1 animate-pulse rounded-full bg-gray-800 [animation-delay:150ms] [animation-duration:1s] dark:bg-gray-200"></div>
          <div class="h-3.5 w-1 animate-pulse rounded-full bg-gray-800 [animation-delay:300ms] [animation-duration:1s] dark:bg-gray-200"></div>
          <div class="h-5.5 w-1 animate-pulse rounded-full bg-gray-800 [animation-delay:450ms] [animation-duration:1s] dark:bg-gray-200"></div>
          <div class="h-4 w-1 animate-pulse rounded-full bg-gray-800 [animation-delay:600ms] [animation-duration:1s] dark:bg-gray-200"></div>
        </div>
        <h1 class="animate-pulse text-center text-[10px] font-bold whitespace-nowrap text-gray-900 sm:text-xs dark:text-white" th:text="${site.title}"></h1>
      </div>
    </div>
  </div>
</div>
